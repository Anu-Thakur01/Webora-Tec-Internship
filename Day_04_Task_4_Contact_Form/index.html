<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact | Anu Kumari Hajam</title>
  <meta name="description" content="A contact page with a styled form and JavaScript validation.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="page">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <div class="container layout">

      <!-- Left: info -->
      <section class="info">
        <a href="#" class="logo">Anu<span>.</span></a>
        <h1>Let's talk</h1>
        <p>
          Have a question, an idea or a project in mind? Fill in the form and
          I will get back to you as soon as I can.
        </p>
        <ul class="info-list">
          <li><span>Email</span> anuthakur2062@gmail.com</li>
          <li><span>Location</span> Kathmandu, Nepal</li>
          <li><span>Reply time</span> Within one or two days</li>
        </ul>
      </section>

      <!-- Right: form -->
      <section class="form-card" aria-labelledby="form-title">
        <h2 id="form-title">Send a message</h2>

        <form id="contactForm" novalidate>
          <div class="field">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" placeholder="Your full name" autocomplete="name" required>
            <p class="error" id="nameError" role="alert"></p>
          </div>

          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required>
            <p class="error" id="emailError" role="alert"></p>
          </div>

          <div class="field">
            <label for="message">Message</label>
            <textarea id="message" name="message" rows="5" placeholder="Write your message here" required></textarea>
            <p class="error" id="messageError" role="alert"></p>
          </div>

          <button type="submit" class="btn">Send message</button>
        </form>

        <p class="success" id="successMsg" role="status" hidden></p>
      </section>

    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
